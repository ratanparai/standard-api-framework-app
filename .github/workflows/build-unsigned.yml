name: Build (unsigned)

# Builds UNSIGNED installers for macOS (universal .dmg) and Windows (NSIS
# setup .exe) and publishes them as a GitHub Release with direct download
# links. Needs NO repository secrets, so it works on forks.
#
# What's switched off compared to release.yml (via --config, which
# JSON-merge-patches tauri.conf.json; null removes a key):
#   - Windows code signing (AZURE_CREDENTIALS / scripts/sign.cmd)
#   - updater artifacts (TAURI_SIGNING_PRIVATE_KEY)
#   - Apple signing: the .app is ad-hoc signed ("-") instead, so Apple
#     Silicon Macs run it after the usual Gatekeeper "unidentified
#     developer" prompt rather than reporting it as damaged.
#
# Triggers:
#   - push to feature/ratan/kroxy-ack -> builds the pushed commit, tags it
#     build-<version>-<branch>-run<N>
#   - push a tag named build-*  -> builds that commit, release uses the tag
#   - Actions tab "Run workflow" -> builds the chosen branch, tagged like a
#     branch push
# The tags this workflow creates don't re-trigger it: pushes made with
# GITHUB_TOKEN never start new workflow runs.

on:
  push:
    branches:
      - feature/ratan/kroxy-ack
    tags:
      - "build-*"
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch cancels a build still running for an
# older commit, so only the latest code gets released.
concurrency:
  group: build-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            os: macos
          - platform: windows-latest
            os: windows
    runs-on: ${{ matrix.platform }}
    env:
      # librdkafka 2.3.0's vendored CMakeLists.txt — see ci.yml.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: unsigned-${{ matrix.os }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build unsigned universal .dmg
        if: matrix.os == 'macos'
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}' > "$RUNNER_TEMP/unsigned.conf.json"
          npx tauri build --target universal-apple-darwin --bundles dmg --config "$RUNNER_TEMP/unsigned.conf.json"

      - name: Build unsigned NSIS installer
        if: matrix.os == 'windows'
        # Default pwsh shell on purpose: under `shell: bash` Git Bash's MSYS
        # perl wins on PATH and the vendored OpenSSL Configure fails (missing
        # Locale::Maketext::Simple); pwsh resolves the runner's Strawberry Perl.
        run: |
          '{"bundle":{"createUpdaterArtifacts":false,"windows":{"signCommand":null}}}' | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP\unsigned.conf.json"
          npx tauri build --bundles nsis --config "$env:RUNNER_TEMP\unsigned.conf.json"

      - name: Collect installer with a clean file name
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          if [ "${{ matrix.os }}" = macos ]; then
            cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/Standard-API-Framework_${version}_macOS_universal.dmg"
          else
            cp src-tauri/target/release/bundle/nsis/*.exe "out/Standard-API-Framework_${version}_Windows_x64-setup.exe"
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            branch=$(echo "$GITHUB_REF_NAME" | sed 's#.*/##')
            tag="build-${version}-${branch}-run${GITHUB_RUN_NUMBER}"
          fi
          cat > notes.md <<EOF
          Unsigned test build of **${version}** from \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}).

          **macOS (universal: Apple Silicon + Intel):** open the .dmg and drag the app to Applications. The first time you open it, right-click the app and choose Open, or allow it under System Settings → Privacy & Security. If macOS still refuses, run \`xattr -dr com.apple.quarantine "/Applications/Standard API Framework.app"\`.

          **Windows (x64):** run the setup .exe. If SmartScreen appears, click More info → Run anyway.
          EOF
          gh release create "$tag" out/* \
            --target "$GITHUB_SHA" \
            --title "Standard API Framework ${version} (unsigned build)" \
            --notes-file notes.md
          echo "### Download links" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*; do
            echo "- https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
