name: Build (unsigned)

# Builds UNSIGNED installers for macOS (universal .dmg) and Windows (NSIS
# setup .exe) and publishes them as a GitHub Release with direct download
# links. Needs NO repository secrets, so it works on forks.
#
# What's switched off compared to release.yml (via --config, which
# JSON-merge-patches tauri.conf.json; null removes a key):
#   - Windows code signing (AZURE_CREDENTIALS / scripts/sign.cmd)
#   - Apple signing: the .app is ad-hoc signed ("-") instead, so Apple
#     Silicon Macs run it after the usual Gatekeeper "unidentified
#     developer" prompt rather than reporting it as damaged.
#
# Updates come from THIS fork only: tauri.conf.json points the updater at
# this repository's latest release and carries the fork's own minisign
# public key, so the official EcoHub release (signed with EcoHub's key) can
# never replace a fork install. The builds sign their updater artifacts with
# the TAURI_SIGNING_PRIVATE_KEY repository secret (key without password), and
# the release job publishes latest.json next to the installers. An installed
# app is offered an update only when the version in tauri.conf.json goes up.
#
# Triggers:
#   - push to feature/ratan/kroxy-ack -> builds the pushed commit, tags it
#     build-<version>-<branch>-run<N>
#   - push a tag named build-*  -> builds that commit, release uses the tag
#   - Actions tab "Run workflow" -> builds the chosen branch, tagged like a
#     branch push
# The tags this workflow creates don't re-trigger it: pushes made with
# GITHUB_TOKEN never start new workflow runs.

on:
  push:
    branches:
      - feature/ratan/kroxy-ack
    tags:
      - "build-*"
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch cancels a build still running for an
# older commit, so only the latest code gets released.
concurrency:
  group: build-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
            os: macos
          - platform: windows-latest
            os: windows
    runs-on: ${{ matrix.platform }}
    env:
      # librdkafka 2.3.0's vendored CMakeLists.txt — see ci.yml.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      # Signs the updater artifacts (.app.tar.gz / setup .exe) for latest.json.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: unsigned-${{ matrix.os }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build unsigned universal .dmg
        if: matrix.os == 'macos'
        run: |
          echo '{"bundle":{"macOS":{"signingIdentity":"-"}}}' > "$RUNNER_TEMP/unsigned.conf.json"
          # "app" is needed too: the updater artifact is the .app.tar.gz.
          npx tauri build --target universal-apple-darwin --bundles app,dmg --config "$RUNNER_TEMP/unsigned.conf.json"

      - name: Build unsigned NSIS installer
        if: matrix.os == 'windows'
        # Default pwsh shell on purpose: under `shell: bash` Git Bash's MSYS
        # perl wins on PATH and the vendored OpenSSL Configure fails (missing
        # Locale::Maketext::Simple); pwsh resolves the runner's Strawberry Perl.
        run: |
          '{"bundle":{"windows":{"signCommand":null}}}' | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP\unsigned.conf.json"
          npx tauri build --bundles nsis --config "$env:RUNNER_TEMP\unsigned.conf.json"

      - name: Collect installer with a clean file name
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          if [ "${{ matrix.os }}" = macos ]; then
            bundle=src-tauri/target/universal-apple-darwin/release/bundle
            cp "$bundle"/dmg/*.dmg "out/Standard-API-Framework_${version}_macOS_universal.dmg"
            cp "$bundle"/macos/*.app.tar.gz "out/Standard-API-Framework_${version}_macOS_universal.app.tar.gz"
            cp "$bundle"/macos/*.app.tar.gz.sig "out/Standard-API-Framework_${version}_macOS_universal.app.tar.gz.sig"
          else
            bundle=src-tauri/target/release/bundle
            cp "$bundle"/nsis/*-setup.exe "out/Standard-API-Framework_${version}_Windows_x64-setup.exe"
            cp "$bundle"/nsis/*-setup.exe.sig "out/Standard-API-Framework_${version}_Windows_x64-setup.exe.sig"
          fi
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            branch=$(echo "$GITHUB_REF_NAME" | sed 's#.*/##')
            tag="build-${version}-${branch}-run${GITHUB_RUN_NUMBER}"
          fi
          cat > notes.md <<EOF
          Unsigned test build of **${version}** from \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}).

          **macOS (universal: Apple Silicon + Intel):** open the .dmg and drag the app to Applications. The first time you open it, right-click the app and choose Open, or allow it under System Settings → Privacy & Security. If macOS still refuses, run \`xattr -dr com.apple.quarantine "/Applications/Standard API Framework.app"\`.

          **Windows (x64):** run the setup .exe. If SmartScreen appears, click More info → Run anyway.
          EOF
          # Updater manifest. The universal macOS archive serves both Mac
          # architectures. The .sig contents go into the manifest, so the
          # .sig files themselves are not published.
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          mac="Standard-API-Framework_${version}_macOS_universal.app.tar.gz"
          win="Standard-API-Framework_${version}_Windows_x64-setup.exe"
          VERSION="$version" BASE="$base" MAC="$mac" WIN="$win" node -e '
            const fs = require("fs");
            const { VERSION, BASE, MAC, WIN } = process.env;
            const sig = (f) => fs.readFileSync(`out/${f}.sig`, "utf8").trim();
            const macEntry = { signature: sig(MAC), url: `${BASE}/${MAC}` };
            const winEntry = { signature: sig(WIN), url: `${BASE}/${WIN}` };
            const manifest = {
              version: VERSION,
              notes: "EHP fork build",
              pub_date: new Date().toISOString(),
              platforms: {
                "darwin-aarch64": macEntry,
                "darwin-x86_64": macEntry,
                "windows-x86_64": winEntry,
                "windows-x86_64-nsis": winEntry,
              },
            };
            fs.writeFileSync("out/latest.json", JSON.stringify(manifest, null, 2));
          '
          rm out/*.sig
          cat out/latest.json
          gh release create "$tag" out/* \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Standard API Framework ${version} (unsigned build)" \
            --notes-file notes.md
          echo "### Download links" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*; do
            echo "- https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
